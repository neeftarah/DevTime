services:
  php:
    image: php:8.5-fpm
    container_name: sfsandbox-php
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    volumes:
      - .:/var/www/html:cached,delegated
      - /var/www/html/vendor
      - /var/www/html/var
      - /var/www/html/node_modules
    working_dir: /var/www/html
    environment:
      PHP_IDE_CONFIG: "serverName=sfsandbox"
    networks:
      - sfsandbox_network
    depends_on:
      - database

  ###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: sfsandbox-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sfsandbox}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd4Tests}
      POSTGRES_USER: ${POSTGRES_USER:-sfsandbox}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-sfsandbox}", "-U", "${POSTGRES_USER:-sfsandbox}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    networks:
      - sfsandbox_network
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

  nginx:
    image: nginx:stable-alpine
    container_name: sfsandbox-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:cached
      - .docker/nginx/conf.d/sfsandbox.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - sfsandbox_network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: sfsandbox-rabbitmq
    ports:
      - "5672:5672"       # Port pour l'application (AMQP)
      - "15672:15672"     # Port pour l'interface web de gestion
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - sfsandbox_network

  redis:
    image: redis:8-alpine
    container_name: sfsandbox-redis
    ports:
      - "6379:6379"
    networks:
      - sfsandbox_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.3
    container_name: sfsandbox-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - sfsandbox_network
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

networks:
  sfsandbox_network:
    driver: bridge

volumes:
  ###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  elasticsearch_data:
